# Render Blueprint — one-click deploy:
# https://render.com/deploy?repo=https://github.com/cubinghay-lgtm/lane334
services:
  - type: web
    name: lane
    runtime: node
    plan: free
    rootDir: lane-driver-pwa-mvp
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile && npx --yes pnpm@10.28.0 run build
    startCommand: NODE_ENV=production node dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: ./data/lane.db
